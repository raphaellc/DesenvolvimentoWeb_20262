<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card de Perfil Responsivo</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="card">

    <div class="card-topo">
      <img class="avatar" src="img/avatar.png" alt="Foto de perfil de Nome Sobrenome" />

      <div class="dados">
        <h1 class="nome">Nome Sobrenome</h1>
        <p class="cargo">Desenvolvedor Fullstack.</p>
      </div>
    </div>

    <div class="acoes">
      <a class="botao" href="#">Seguir</a>
      <a class="botao" href="#">Mensagem</a>
    </div>

  </div>

</body>
</html>
